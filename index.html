<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- css -->
  <link rel="stylesheet" href="./src/assets/css/main.css">
  <title>Home page</title>
</head>

<body>
  <header>
    <nav>
      <div class="nav-container">
        <img class="nav-logo" src="https://demo.ovathemewp.com/meup/wp-content/uploads/2019/06/Asset-9.svg" alt="Logo">
        <div class="links-container">
          <ul class="nav-links">
            <li><a class="links" href="./index.html">Home</a></li>
            <li><a class="links" href="#">Events</a></li>
            <li><a class="links" href="#">Events Detail</a></li>
            <li><a class="links" href="#">My Tickets</a></li>
            <li><a class="links" href="#">Favorites</a></li>
            <li><a class="links" href="./login.html"><i id="user" class="fa-regular fa-user"></i>Login</a></li>
            <li><span class="dividing">|</span></li>
            <li><a class="links" href="./register.html">Register</a></li>
          </ul>
        </div>
        <div class="hamburger">
          <i class="fa-solid fa-bars"></i>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="main-heading">
      <div class="search-container">
        <h1>Connecting the world</h1>
        <p>Easy to search, you just enter the keyword</p>
        <div class="inputs-container">
          <div class="inputs-container">
            <div class="input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Enter name...">
            </div>
        
            <div class="select-wrapper">
                <i class="fa-solid fa-layer-group"></i>
                <select name="event">
                    <option value="" disabled selected>Select event</option>
                    <option value="concert">Concert</option>
                    <option value="music">Music</option>
                    <option value="conference">Conference</option>
                    <option value="education">Education</option>
                </select>
            </div>
        
            <div class="select-wrapper">
                <i class="fa-regular fa-calendar"></i>
                <select name="time">
                    <option value="" disabled selected>Select time</option>
                    <option value="today">Today</option>
                    <option value="this-week">This Week</option>
                    <option value="this-weekend">This Weekend</option>
                    <option value="next-week">Next Week</option>
                    <option value="next-weekend">Next Weekend</option>
                    <option value="next-month">Next Month</option>
                </select>
            </div>
        </div>
        
        </div>
        <div class="search-btn">
          <button class="button">Search</button>
        </div>
      </div>
    </section>
  </main>
  <!-- JS -->
  <script type="module" src="./src/assets/js/main.js"></script>
</body>

</html>
